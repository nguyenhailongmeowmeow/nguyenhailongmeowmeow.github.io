<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=/vn/" />
    <script>
      window.location.replace("/vn/");
    </script>
    <!--
      Ban da tim thay easter egg trong source.
      Neu ban dang doc dong nay, chuc mung: ban rat to mo.
      Nguyen Hai Long - nguyenhailongmeowmeow.github.io
    -->
    <script src="https://cdn.jsdelivr.net/npm/disable-devtool@latest"></script>
    <script>
      (function () {
        var devtoolOverlayTimer;
        var devtoolOpenAttempts = Number(
          sessionStorage.getItem("devtoolOpenAttempts") || "0",
        );
        var visitorIp = sessionStorage.getItem("visitorIp") || "đang tải...";
        var visitorIpRequested = Boolean(sessionStorage.getItem("visitorIp"));
        var isEnglishPage = window.location.pathname.indexOf("/en/") === 0;
        var devtoolTitle = isEnglishPage
          ? "Oh dude, why are you opening Developer Tools?"
          : "Bạn đã mở Developer Tools :(((";
        var devtoolMessage = isEnglishPage
          ? "Please close it and refresh the page to continue."
          : "Làm ơn hãy đóng DevTools và tải lại trang để tiếp tục.";
        var devtoolIpLabel = isEnglishPage
          ? "Your IP address is:"
          : "IP của bạn là:";

        function updateVisitorIp(ip) {
          visitorIp = ip || "không xác định";
          sessionStorage.setItem("visitorIp", visitorIp);

          var ipTarget = document.querySelector("[data-devtool-ip]");
          if (ipTarget) ipTarget.textContent = visitorIp;
        }

        function loadVisitorIp() {
          if (visitorIpRequested) return;
          visitorIpRequested = true;

          fetch("https://api.ipify.org?format=json", {
            cache: "no-store",
          })
            .then(function (response) {
              if (!response.ok) throw new Error("IP lookup failed");
              return response.json();
            })
            .then(function (data) {
              updateVisitorIp(data.ip);
            })
            .catch(function () {
              updateVisitorIp("không xác định");
            });
        }

        function showDevtoolOverlay() {
          var root = document.body || document.documentElement;
          if (!root) return;

          var overlay = document.getElementById("developer-tools-blocker");
          if (!overlay) {
            overlay = document.createElement("div");
            overlay.id = "developer-tools-blocker";
            overlay.setAttribute("role", "alert");
            overlay.setAttribute("aria-live", "assertive");
            overlay.innerHTML =
              '<div class="developer-tools-blocker__panel">' +
              "<strong>" +
              devtoolTitle +
              "</strong>" +
              "<span>" +
              devtoolMessage +
              "</span>" +
              "<small>" +
              devtoolIpLabel +
              " <b data-devtool-ip>đang tải...</b></small>" +
              "</div>";
            root.appendChild(overlay);
          }

          var ipTarget = overlay.querySelector("[data-devtool-ip]");
          if (ipTarget) ipTarget.textContent = visitorIp;
          loadVisitorIp();

          document.documentElement.classList.add("developer-tools-locked");
          if (document.body)
            document.body.classList.add("developer-tools-locked");

          overlay.classList.remove("developer-tools-blocker--pulse");
          void overlay.offsetWidth;
          overlay.classList.add("developer-tools-blocker--pulse");
        }

        function startDevtoolOverlaySpam() {
          devtoolOpenAttempts += 1;
          sessionStorage.setItem(
            "devtoolOpenAttempts",
            String(devtoolOpenAttempts),
          );
          showDevtoolOverlay();

          window.clearInterval(devtoolOverlayTimer);
          devtoolOverlayTimer = window.setInterval(showDevtoolOverlay, 700);
        }

        function stopDevtoolOverlaySpam() {
          window.clearInterval(devtoolOverlayTimer);
          var overlay = document.getElementById("developer-tools-blocker");
          if (overlay) overlay.remove();
          document.documentElement.classList.remove("developer-tools-locked");
          if (document.body)
            document.body.classList.remove("developer-tools-locked");
        }

        function isDevtoolShortcut(event) {
          var key = event.key.toLowerCase();
          return (
            event.key === "F12" ||
            (event.ctrlKey &&
              event.shiftKey &&
              ["i", "j", "c"].indexOf(key) !== -1) ||
            (event.metaKey &&
              event.altKey &&
              ["i", "j", "c"].indexOf(key) !== -1)
          );
        }

        document.addEventListener(
          "keydown",
          function (event) {
            if (isDevtoolShortcut(event)) startDevtoolOverlaySpam();
          },
          true,
        );

        if (window.DisableDevtool)
          DisableDevtool({
            disableMenu: true,
            clearLog: true,
            ondevtoolopen: function (_type, next) {
              startDevtoolOverlaySpam();
              next();
            },
            ondevtoolclose: stopDevtoolOverlaySpam,
          });
      })();
    </script>
    <link rel="canonical" href="/vn/" />
    <title>Nguyen Hai Long</title>
  </head>
  <body>
    <p><a href="/vn/">Di den trang tieng Viet</a></p>
  </body>
</html>
